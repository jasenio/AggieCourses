services:
  postgres:
    image: paradedb/paradedb:0.24.3
    # Keep PostgreSQL from sizing its caches for the much larger developer
    # machine. These values leave room for Ubuntu, Docker, and the API on a
    # small Lightsail instance while retaining enough memory for this catalog.
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - max_connections=30
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-course_recommender}
      POSTGRES_USER: ${POSTGRES_USER:-course_recommender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - paradedb-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  bootstrap:
    image: ${APP_IMAGE:-aggiecourses:local}
    build:
      context: .
    command: ["python", "scripts/bootstrap_postgres.py"]
    environment: &app-environment
      DATABASE_URL: postgresql://${POSTGRES_USER:-course_recommender}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-course_recommender}
      POSTGRES_POOL_MIN_SIZE: 1
      POSTGRES_POOL_MAX_SIZE: 4
      # Prevent PyTorch and its numerical backends from oversubscribing the
      # small Lightsail CPU during query embedding.
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      TOKENIZERS_PARALLELISM: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:-aggiecourses:local}
    build:
      context: .
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5).read()\""]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  paradedb-data:
  caddy-data:
  caddy-config:
