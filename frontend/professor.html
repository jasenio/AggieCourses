<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Professor Details</title>
    <meta
      name="description"
      content="Explore Texas A&M professor teaching history, courses, sections, enrollment, and grade-report trends."
    />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Aggie Courses" />
    <meta property="og:title" content="Texas A&amp;M Professor History | Aggie Courses" />
    <meta
      property="og:description"
      content="Explore Texas A&M professor teaching history, courses, sections, enrollment, and grade-report trends."
    />
    <link rel="stylesheet" href="/static/theme.css?v=2" />
    <link rel="stylesheet" href="/static/styles.css?v=95" />
    <script>
      // Resolve the theme before first paint so there is no flash of the wrong one.
      (function () {
        try {
          var stored = localStorage.getItem("course-search-theme");
          if (stored !== "dark" && stored !== "light") {
            stored =
              window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          }
          document.documentElement.setAttribute("data-theme", stored);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <main class="shell course-page-shell professor-page-shell">
      <div class="page-topbar">
        <a id="back-to-course" class="back-link" href="/courses">← Back to course search</a>
        <div class="theme-switch" data-active="light">
          <span class="theme-switch-label" data-for="light">Light</span>
          <button
            type="button"
            class="theme-toggle"
            role="switch"
            aria-checked="false"
            aria-label="Dark mode"
          >
            <span class="theme-toggle-knob"></span>
          </button>
          <span class="theme-switch-label" data-for="dark">Dark</span>
        </div>
      </div>
      <section id="professor-page" class="professor-page" aria-live="polite">
        <p class="course-loading">Loading professor details…</p>
      </section>
    </main>
    <script src="/static/theme.js?v=1"></script>
    <script src="/static/professor.js?v=13"></script>
  </body>
</html>
